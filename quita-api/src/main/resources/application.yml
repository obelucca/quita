spring:
  application:
    name: quita-api

  datasource:
    url: jdbc:postgresql://localhost:5432/quita_db
    username: quita_user
    password: quita_pass

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

app:
  jwt:
    secret: 9a2f7c4e5b6d8a9f0e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c1b2a3f
  storage:
    upload-dir: uploads

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

quita:
  insights:
    high-debt-threshold: 10000.00