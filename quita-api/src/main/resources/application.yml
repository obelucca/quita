spring:
  application:
    name: quita-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-XXXXXXXX}
    public-key: ${MERCADOPAGO_PUBLIC_KEY:TEST-XXXXXXXX}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:TEST-XXXXXXXX}


management:
  endpoints:
    web:
      exposure:
        include: health

quita:
  insights:
    high-debt-threshold: 10000.00
  llm:
    provider: ${QUITA_LLM_PROVIDER:GEMINI}
    mock: ${QUITA_LLM_MOCK:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434/api/generate}